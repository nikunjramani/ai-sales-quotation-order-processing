[project]
name = "ai-sales-quotation-order-processing"
version = "0.1.0"
description = "Multi-business sales quotation and order automation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langchain-core>=1,<2",
    "pypdf>=6,<7",
    "reportlab>=5.0.1,<5.1",
    "cryptography>=50,<51",
    # Phase 2: password hashing (Argon2id) and logo checking/re-encoding (already installed
    # through ReportLab; imported directly now, so pinned here with the same range).
    "argon2-cffi>=25.1,<26",
    "pillow>=12.3,<13",
    # Phase 5: HTTP client for provider packages that call a tool's API without an SDK
    # (Telegram). Imported only inside adapters/providers/ (architecture test).
    "httpx>=0.28,<1",
]

# Pluggable parts are found by name through these entry points (ADR 0018). A new provider or
# secret store is one package plus one entry point (here or in its own package); no core change.
[project.entry-points."quotation_app.providers"]
api = "quotation_app.adapters.providers.api:build"
simulated = "quotation_app.adapters.providers.simulated:build"
local_catalogue = "quotation_app.adapters.providers.local_catalogue:build"
web_chat = "quotation_app.adapters.providers.web_chat:build"
telegram = "quotation_app.adapters.providers.telegram:build"

[project.entry-points."quotation_app.secret_stores"]
local = "quotation_app.adapters.secrets.local:build"
none = "quotation_app.adapters.secrets.none:build"

# Account email senders (phase 2): `console` writes files for development. A real sender is one
# more package with its own entry point (phase 5), chosen by QUOTATION_MAILER.
[project.entry-points."quotation_app.mailers"]
console = "quotation_app.adapters.accounts.mail.console:build"

[project.optional-dependencies]
# AI enquiry reader: the generic model loader plus the provider packages in use. Any other
# LangChain provider is added here as a package only (no code change); see ADR 0017.
ai = [
    "langchain>=1.4,<2",
    "langchain-google-genai>=4.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pyyaml>=6,<7",
    "httpx2>=2.16,<3",
    "types-reportlab>=5.0.0.20261008,<5.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotation_app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src", "tests", "migrations", "scripts"]
# Test folders mirror src and have no __init__.py, so test file names repeat
# (e.g. unit/domain/test_pricing.py and unit/application/test_pricing.py).
# These settings name modules by their path, so the duplicates stay distinct.
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode allows repeated test file names without __init__.py files in tests/.
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]

[tool.uv]
# Transitive pins: only versions released at least 14 days before adoption.
constraint-dependencies = ["pillow>=12.3,<13", "google-genai<=2.29.0", "google-auth<=2.61.0", "pycparser<=3.1"]
