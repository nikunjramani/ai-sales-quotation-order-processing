[project]
name = "ai-sales-quotation-order-processing"
version = "0.1.0"
description = "Multi-business sales quotation and order automation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langchain-core>=1,<2",
    "pypdf>=6,<7",
    "reportlab>=5.0.1,<5.1",
]

[project.optional-dependencies]
# AI enquiry reader: the generic model loader plus the provider packages in use. Any other
# LangChain provider is added here as a package only (no code change); see ADR 0017.
ai = [
    "langchain>=1.4,<2",
    "langchain-google-genai>=4.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pyyaml>=6,<7",
    "httpx2>=2.16,<3",
    "types-reportlab>=5.0.0.20261008,<5.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotation_app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src", "tests", "migrations", "scripts"]
# Test folders mirror src and have no __init__.py, so test file names repeat
# (e.g. unit/domain/test_pricing.py and unit/application/test_pricing.py).
# These settings name modules by their path, so the duplicates stay distinct.
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode allows repeated test file names without __init__.py files in tests/.
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: requires an explicitly configured disposable PostgreSQL database"]

[tool.uv]
# Transitive pins: only versions released at least 14 days before adoption.
constraint-dependencies = ["pillow>=12.3,<13", "google-genai<=2.29.0", "google-auth<=2.61.0", "pycparser<=3.1"]
