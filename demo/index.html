<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f2f2f2; }
  header { padding: 10px 16px; background: #333; color: #fff; display: flex; justify-content: space-between; align-items: center; }
  header button { background: #555; color: #fff; border: 0; padding: 6px 10px; cursor: pointer; }
  main { display: flex; gap: 16px; padding: 16px; height: calc(100vh - 80px); box-sizing: border-box; }
  .pane { flex: 1; display: flex; flex-direction: column; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
  .pane h2 { margin: 0; padding: 10px 14px; font-size: 16px; border-bottom: 1px solid #ddd; }
  .customer h2 { background: #e3efff; }
  .manager h2 { background: #e5f7e8; }
  .log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; font-size: 14px; }
  .me { align-self: flex-end; background: #d6e8ff; }
  .them { align-self: flex-start; background: #eee; }
  .notice { align-self: center; background: #fff6d6; font-size: 13px; }
  .msg small { display: block; color: #666; margin-top: 4px; }
  .msg button { margin: 6px 6px 0 0; padding: 5px 10px; cursor: pointer; }
  table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  td, th { border: 1px solid #ccc; padding: 2px 6px; text-align: left; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #ddd; }
  textarea { flex: 1; height: 50px; font: inherit; }
  .error { color: #b00; padding: 0 12px 8px; font-size: 13px; }
  .hint { color: #777; font-size: 13px; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <strong>Quotation demo — customer and manager</strong>
  <button id="reset" title="Clears both windows; records stay in the database and portal">Clear windows</button>
</header>
<main>
  <section class="pane customer">
    <h2>Customer on the website chat (phase 4)</h2>
    <iframe id="website-chat" title="Website chat" style="flex:1;border:0;width:100%"></iframe>
    <div class="error" id="chat-error"></div>
  </section>
  <section class="pane customer">
    <h2>Customer system (API enquiry)</h2>
    <div class="log" id="customer-log"></div>
    <div class="error" id="customer-error"></div>
    <form id="enquiry-form">
      <textarea id="enquiry-text">Please quote 2 x IND-FAN-450 and 150 pcs M8 bolts</textarea>
      <button type="submit">Send</button>
    </form>
  </section>
  <section class="pane manager">
    <h2>Manager's phone (approval messages)</h2>
    <div class="log" id="manager-log"></div>
    <div class="error" id="manager-error"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => (iso ? new Date(iso).toLocaleString() : "");

async function api(method, url, body) {
  const response = await fetch(url, {
    method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail ?? data);
    throw new Error(`${response.status}: ${detail}`);
  }
  return data;
}

// ---------- customer window
const CUSTOMER_STATUS = {
  open: "You can accept or decline this quotation.",
  accepted: "You accepted this quotation. Thank you!",
  declined: "You declined this quotation.",
  expired: "This quotation has expired.",
  withdrawn: "The seller withdrew this quotation.",
  being_revised: "Prices changed; a revised quotation is being prepared.",
  closed: "This quotation is closed.",
};

function reply(item) {
  const q = item.quotation;
  if (q) {
    const rows = q.lines.map((l) =>
      `<tr><td>${esc(l.description)}</td><td>${esc(l.quantity)} ${esc(l.unit)}</td><td>${esc(l.unit_price)}</td><td>${esc(l.line_total)}</td></tr>`).join("");
    const buttons = q.status === "open"
      ? `<button onclick="answer('${item.enquiry_id}','accept')">Accept</button>
         <button onclick="answer('${item.enquiry_id}','decline')">Decline</button>` : "";
    return `Your quotation ${esc(q.quotation_number)} (version ${q.version}) is ready.
<table><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Total</th></tr>${rows}</table>Subtotal ${esc(q.subtotal)} · Tax ${esc(q.tax)} · <b>Total ${esc(q.total)} ${esc(q.currency)}</b>
Valid until ${when(q.valid_until)}
<b>${esc(CUSTOMER_STATUS[q.status] ?? q.status)}</b>
<a href="/demo/customer/enquiries/${item.enquiry_id}/quotation.pdf" target="_blank">Download PDF</a>
${buttons}`;
  }
  const extraction = item.extraction;
  if (item.status === "needs_clarification" && extraction) {
    return "We need a bit more information:\n- " + extraction.questions.map(esc).join("\n- ") +
      "\nPlease send a new message with the details.";
  }
  if (item.status === "needs_review") {
    return "A member of our sales team will look at your enquiry.";
  }
  if (extraction && extraction.lines.length) {
    const lines = extraction.lines.map((l) => `- ${esc(l.quantity)} ${esc(l.unit)} ${esc(l.sku)}`).join("\n");
    return `We understood:\n${lines}\nYour quotation is waiting for manager approval…`;
  }
  return `Received, processing… (${esc(item.status)})`;
}

async function refreshCustomer() {
  const items = await api("GET", "/demo/customer/enquiries");
  const log = $("customer-log");
  const html = items.length ? items.map((item) => `
    <div class="msg me">${esc(item.text ?? "Enquiry")} <small>${when(item.received_at)}</small></div>
    <div class="msg them">${reply(item)}</div>`).join("")
    : `<div class="hint">Type an enquiry below and press Send.</div>`;
  if (log.dataset.html !== html) {
    log.dataset.html = html;
    log.innerHTML = html;
    log.scrollTop = log.scrollHeight;
  }
}

$("enquiry-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = $("enquiry-text").value.trim();
  if (!text) return;
  $("customer-error").textContent = "";
  try {
    const result = await api("POST", "/demo/customer/enquiries", { text });
    $("enquiry-text").value = "";
    refresh();
  } catch (error) { $("customer-error").textContent = error.message; }
});

async function answer(enquiryId, action) {
  let reason;
  if (action === "decline") {
    reason = prompt("Reason for declining (optional):") ?? undefined;
  }
  $("customer-error").textContent = "";
  try { await api("POST", `/demo/customer/enquiries/${enquiryId}/answer`, { action, reason }); }
  catch (error) { $("customer-error").textContent = error.message; }
  refresh();
}


// ---------- manager window
const DECIDED = { approve: "Approved ✔", reject: "Rejected ✘", request_revision: "Revision requested ↺" };

async function refreshManager() {
  const messages = await api("GET", "/demo/manager/messages");
  const log = $("manager-log");
  const html = messages.length ? messages.map((m) => {
    if (m.kind === "notice") return `<div class="msg notice">🔔 ${esc(m.text)}</div>`;
    const actions = m.decision
      ? `<b>${DECIDED[m.decision] ?? m.decision}</b>`
      : `<button onclick="decide('${m.task_id}','approve')">Approve</button>
         <button onclick="decide('${m.task_id}','reject')">Reject</button>
         <button onclick="decide('${m.task_id}','request_revision')">Request revision</button>`;
    return `<div class="msg them">${esc(m.text)}<small>Reply by ${when(m.expires_at)}</small>${actions}</div>`;
  }).join("") : `<div class="hint">Approval requests will appear here.</div>`;
  if (log.dataset.html !== html) {
    log.dataset.html = html;
    log.innerHTML = html;
    log.scrollTop = log.scrollHeight;
  }
}

async function decide(taskId, action) {
  let reason;
  if (action !== "approve") {
    reason = prompt(action === "reject" ? "Reason for rejecting:" : "What should be changed?");
    if (!reason) return;
  }
  $("manager-error").textContent = "";
  try { await api("POST", "/demo/manager/decide", { task_id: taskId, action, reason }); }
  catch (error) { $("manager-error").textContent = error.message; }
  refresh();
}

$("reset").addEventListener("click", async () => {
  if (!confirm("Clear both windows?")) return;
  await api("POST", "/demo/reset");
  refresh();
});

// ---------- polling
async function refresh() {
  try { await refreshCustomer(); } catch (error) { $("customer-error").textContent = error.message; }
  try { await refreshManager(); } catch (error) { $("manager-error").textContent = error.message; }
}
setInterval(refresh, 2000);
// The real website chat page of the demo business, as a visitor would see it.
api("GET", "/demo/chat")
  .then((chat) => { $("website-chat").src = chat.chat_url; })
  .catch((error) => { $("chat-error").textContent = error.message; });
refresh();
</script>
</body>
</html>
