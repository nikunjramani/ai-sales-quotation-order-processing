name: quotation-local
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: quotation_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the local environment setup script first}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Missing owner password}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Missing app password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - quotation_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotation_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  quotation_pgdata:
