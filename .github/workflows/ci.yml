name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned package manager
        run: python -m pip install uv==0.13.1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Initialize isolated local credentials
        run: uv run python scripts/init_local_env.py
      - name: Start disposable database
        run: docker compose up -d --wait
      - name: Check migrations and integration behaviour
        shell: bash
        run: |
          set -a
          source .env
          set +a
          export TEST_DATABASE_URL="$QUOTATION_DATABASE_URL"
          export TEST_MIGRATION_DATABASE_URL="$QUOTATION_MIGRATION_DATABASE_URL"
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest --run-integration
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run pytest --run-integration
      - name: Stop CI database
        if: always()
        run: docker compose down
