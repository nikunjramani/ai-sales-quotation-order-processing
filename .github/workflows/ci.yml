name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned package manager
        run: python -m pip install uv==0.13.1
      - run: uv sync --locked --all-extras  # includes optional model adapters (e.g. Ollama) for type checks
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Initialize isolated local credentials
        run: uv run python scripts/init_local_env.py
      - name: Start disposable database
        run: docker compose up -d --wait
      - name: Check migrations and integration behaviour
        # Migrates quotation_dev and quotation_test, runs integration tests on quotation_test,
        # then downgrades the test database to empty, upgrades again and repeats the tests.
        run: uv run python scripts/check_database.py --cycle
      - name: Stop CI database
        if: always()
        run: docker compose down
